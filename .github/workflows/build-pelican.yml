name: Build website

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests: build only, to catch template and content errors.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: apache/infrastructure-actions/pelican@main
        with:
          publish: 'false'
          gfm: 'true'

  # master: build and commit the site to the output/ directory of asf-site.
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'master'
      - uses: apache/infrastructure-actions/pelican@main
        with:
          destination: 'asf-site'
          gfm: 'true'
