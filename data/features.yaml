# Feature grid on the home page.

- title: Replication and Partitioning
  text: >-
    Data can easily be partitioned (sharded) or replicated between nodes, allowing
    performance to scale as needed. Durability is ensured through redundant in-memory
    copies and disk-based persistence.
- title: Persistence
  text: >-
    Super fast write-ahead-logging (WAL) persistence with a shared-nothing architecture
    that is optimized for fast parallel recovery of nodes or an entire cluster.
- title: Performance
  text: >-
    Linear-scaling low latency for transactions, reads, writes and query processing of
    indexed or unindexed data.
- title: In-Memory Storage
  text: >-
    Blazing fast in-memory storage optimized for large heaps, with the option of using
    off-heap storage, compression and features such as disk-overflow, eviction and
    expiration of data.
- title: Functions
  text: >-
    Distributed location-aware user functions can be deployed and executed by the same
    nodes storing relevant sharded data for fast parallel processing. Failed operations
    can be retried on replicant nodes.
- title: Transactions
  text: >-
    ACID distributed transactions support efficient and safe coordinated operations on
    colocated data. Transactions can be initiated or suspended by either a client or a
    server.
- title: OQL and Indexes
  text: >-
    Object Query Language allows distributed query execution on hot and cold data, with
    SQL-like capabilities, including joins. Multiple kinds of indexes can be defined and
    consistently maintained across the cluster.
- title: Events
  text: >-
    Clients can be notified about server-side data events, and servers can react
    synchronously or asynchronously with guaranteed delivery of ordered events.
- title: Clustering
  text: >-
    Highly scalable, robust advanced clustering technology with failure detection,
    dynamic scaling, and network-partition detection algorithms.
- title: Multi-Cluster
  text: >-
    Geode clusters can be replicated over WAN in various topologies: active-active,
    active-passive, ring, hub-spoke, star, and more.
- title: Continuous Query
  text: >-
    Clients can stay up to date by registering OQL queries with the Geode servers,
    making event-driven applications possible.
- title: Clients
  text: >-
    Clients are available for Java, C++, and C# .NET. A REST API is available for all
    other languages.
